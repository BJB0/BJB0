name: Update profile art

# Terminal README art: contribution heatmap + info card (daily refresh).
# Pattern from Aviv Ashishta / AVIVASHISHTA29 terminal profile README.

"on":
  schedule:
    - cron: "30 6 * * *"   # ~06:30 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape contribution data (public, no token)
        env:
          GH_PROFILE_USER: BJB0
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render neofetch info card
        run: python scripts/make_info_card.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh terminal profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg"
