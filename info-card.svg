ill="#e6edf3" font-size="12" style="animation-delay:0.16s"><tspan fill="#39d353">Shell:</tspan> I build end-to-end ML pipelines, deploy models with FastAPI, and ship LLM-powered apps—with recent work in multilingual dense retrieval and NLP research.</text><text class="ln" x="112" y="145" fill="#e6edf3" font-size="12" style="animation-delay:0.25s"><tspan fill="#f2cc60">Uptime:</tspan> Open to full-time roles, internships, and hackathons in AI/ML &amp; NLP—and thoughtful collaborations.</text><text class="ln" x="112" y="170" fill="#e6edf3" font-size="13" font-weight="700" style="animation-delay:0.29s"><tspan fill="#d2a8ff">Packages</tspan> (highlights):</text><text class="ln" x="112" y="187" fill="#7d8590" font-size="11" style="animation-delay:0.33s">  ▸ Education: B.Tech CSE at Tezpur University, Assam (Aug 2022 –</text><text class="ln" x="112" y="204" fill="#7d8590" font-size="11" style="animation-delay:0.37s">  ▸ Jun 2026).</text><text class="ln" x="112" y="221" fill="#7d8590" font-size="11" style="animation-delay:0.41s">  ▸ Now: AI Research &amp; Engineering Intern at Khyontek AI — CLEF</text><text class="ln" x="112" y="238" fill="#7d8590" font-size="11" style="animation-delay:0.45s">  ▸ 2026 CheckThat! Task 1 (retrieving publications cited in</text><text class="ln" x="112" y="255" fill="#7d8590" font-size="11" style="animation-delay:0.49s">  ▸ multilingual social claims); experiments with multilingual-E5,</text><text class="ln" x="112" y="272" fill="#7d8590" font-size="11" style="animation-delay:0.53s">  ▸ BGE, and Contriever; co-authored submission to CEUR-WS</text><text class="ln" x="112" y="289" fill="#7d8590" font-size="11" style="animation-delay:0.57s">  ▸ proceedings.</text><text class="ln" x="112" y="306" fill="#7d8590" font-size="11" style="animation-delay:0.61s">  ▸ Before: Project intern at C-DAC (ANUVAAD Chat multilingual</text><text class="ln" x="112" y="323" fill="#7d8590" font-size="11" style="animation-delay:0.65s">  ▸ backend) and AI/ML research intern at IIT Guwahati</text><text class="ln" x="112" y="340" fill="#7d8590" font-size="11" style="animation-delay:0.69s">  ▸ (grasp-force prediction, SHAP, cross-validation).</text><text class="ln" x="112" y="357" fill="#7d8590" font-size="11" style="animation-delay:0.73s">  ▸ Focus: Retrieval &amp; reranking, RAG, reproducible ML, and</text><text class="ln" x="112" y="374" fill="#7d8590" font-size="11" style="animation-delay:0.77s">  ▸ backends that are ready to deploy—not just notebooks.</text><text class="ln" x="112" y="397" fill="#e6edf3" font-size="13" font-weight="700" style="animation-delay:0.81s"><tspan fill="#d2a8ff">Languages</tspan> (tech):</text><text class="ln" x="112" y="414" fill="#e6edf3" font-size="11" style="animation-delay:0.85s">  Python · PyTorch · TensorFlow · Pandas · FastAPI · Docker ·</text><text class="ln" x="112" y="431" fill="#e6edf3" font-size="11" style="animation-delay:0.89s">  Git · GitHub Actions</text><text class="ln" x="112" y="448" fill="#e6edf3" font-size="11" style="animation-delay:0.93s">  React · Flask · Streamlit · Linux · Postgres</text><text class="ln" x="112" y="465" fill="#e6edf3" font-size="11" style="animation-delay:0.97s">  LLMs &amp; NLP: Dense retrieval · RAG · LangChain · LangGraph ·</text><text class="ln" x="112" y="482" fill="#e6edf3" font-size="11" style="animation-delay:1.01s">  scikit-learn · prompt design · Gemini / OpenAI / Anthropic</text><text class="ln" x="112" y="499" fill="#e6edf3" font-size="11" style="animation-delay:1.05s">  APIs</text><text class="ln" x="112" y="516" fill="#e6edf3" font-size="11" style="animation-delay:1.09s">  Also: Pydantic · MLflow · DVC · vector stores (learning</text><text class="ln" x="112" y="533" fill="#e6edf3" font-size="11" style="animation-delay:1.13s">  advanced retrieval &amp; reranking).</text><text class="ln" x="112" y="560" fill="#e6edf3" font-size="11" style="animation-delay:1.17s"><tspan fill="#7d8590">Fun fact: I lift heavier than my code compiles.</tspan></text><rect x="810" y="852" width="8" height="14" fill="#e6edf3"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></rect></svg>